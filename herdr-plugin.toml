id = "open-in-editor"
name = "Open in $EDITOR"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Ctrl-click a file link to open it in $EDITOR, in a new pane split off the current tab."
platforms = ["macos", "linux"]

[[actions]]
id = "edit-file"
title = "Open in $EDITOR"
contexts = ["pane", "selection"]
command = ["bash", "open-in-editor.sh"]

# OSC 8 file:// hyperlinks (agents emit these).
[[link_handlers]]
id = "file-url"
title = "Open file link in $EDITOR"
pattern = '^file://'
action = "edit-file"

# OSC 8 links whose target is a bare path (some tools emit this form).
[[link_handlers]]
id = "file-path"
title = "Open path in $EDITOR"
pattern = '^~?[\w.@/()\[\]+-]+/[\w.@()\[\]+-]+\.[A-Za-z]\w*(?::\d+){0,2}$'
action = "edit-file"
