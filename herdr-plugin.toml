id = "open-in-editor"
name = "Open in $EDITOR"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Open a file link, selection, or clipboard path in $EDITOR, reusing a vi-family editor pane already in the tab or splitting a new one."
platforms = ["macos", "linux"]

[[actions]]
id = "edit-file"
title = "Open in $EDITOR"
contexts = ["pane", "selection"]
command = ["bash", "open-in-editor.sh"]

# Reads the system clipboard instead of the selection context. Useful because
# herdr does not hand selected text to plugins; copy the path first, then bind a
# key to this action.
[[actions]]
id = "edit-clipboard"
title = "Open clipboard in $EDITOR"
contexts = ["pane"]
command = ["bash", "open-in-editor.sh", "--clipboard"]

# OSC 8 file:// hyperlinks (agents emit these).
[[link_handlers]]
id = "file-url"
title = "Open file link in $EDITOR"
pattern = '^file://'
action = "edit-file"
