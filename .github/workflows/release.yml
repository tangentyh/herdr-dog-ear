name: Release

# Pushing a version tag (e.g. `git push origin v0.1.0`) creates the matching
# GitHub release with auto-generated notes. The plugin has no build step —
# herdr installs straight from the repo at the tag — so the release carries no
# assets.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
